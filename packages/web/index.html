<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BPMN Projects</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <div class="page">
    <h1>BPMN projects</h1>
    <p class="sub">Anyone with a project link can open, edit and save it. Every save is kept in the project's history.</p>

    <div class="actions">
      <input type="text" id="newName" placeholder="New diagram name" autocomplete="off">
      <button class="primary" id="createBtn">New diagram</button>
      <button id="importBtn">Import .bpmn files…</button>
      <input type="file" id="importFile" accept=".bpmn,.xml" multiple hidden>
    </div>

    <div id="list"></div>

    <p class="footer"><a href="/licenses" target="_blank" rel="noopener">Third-party licenses</a></p>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const listEl = document.getElementById('list');
    const nameEl = document.getElementById('newName');

    function author() {
      try { return localStorage.getItem('bpmn-author') || ''; } catch { return ''; }
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function fmt(iso) {
      return iso ? new Date(iso).toLocaleString() : '—';
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function load() {
      const res = await fetch('/api/projects');
      const projects = await res.json();
      if (!projects.length) {
        listEl.innerHTML = '<div class="empty">No projects yet. Create a new diagram or import an existing .bpmn file.</div>';
        return;
      }
      listEl.innerHTML = `
        <table class="projects">
          <thead><tr><th>Name</th><th>Last saved</th><th>By</th><th>Versions</th><th></th></tr></thead>
          <tbody>
            ${projects.map((p) => `
              <tr>
                <td><a href="/p/${encodeURIComponent(p.id)}">${esc(p.name)}</a></td>
                <td>${esc(fmt(p.updatedAt))}</td>
                <td>${esc(p.updatedBy || '—')}</td>
                <td class="num">${p.versionCount}</td>
                <td><a href="/api/projects/${encodeURIComponent(p.id)}/download">Download</a></td>
              </tr>`).join('')}
          </tbody>
        </table>`;
    }

    async function create(name, xml) {
      const res = await fetch('/api/projects', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, xml, author: author() })
      });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || 'Failed');
      return body.id;
    }

    document.getElementById('createBtn').onclick = async () => {
      const name = nameEl.value.trim() || 'Untitled diagram';
      try {
        const id = await create(name);
        location.href = `/p/${encodeURIComponent(id)}`;
      } catch (e) { toast(e.message); }
    };
    nameEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('createBtn').click(); });

    const fileEl = document.getElementById('importFile');
    document.getElementById('importBtn').onclick = () => fileEl.click();
    fileEl.onchange = async () => {
      let ok = 0;
      for (const file of fileEl.files) {
        try {
          await create(file.name.replace(/\.(bpmn|xml)$/i, ''), await file.text());
          ok++;
        } catch (e) { toast(`${file.name}: ${e.message}`); }
      }
      fileEl.value = '';
      if (ok) toast(`Imported ${ok} file${ok > 1 ? 's' : ''}`);
      load();
    };

    load();
  </script>
</body>
</html>
