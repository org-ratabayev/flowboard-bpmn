<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BPMN Projects</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <div class="page">
    <div class="page-head">
      <h1>BPMN projects</h1>
      <span class="me" id="me"></span>
    </div>
    <p class="sub">New projects are private: share them with people from the editor. Every save is kept in the project's history.</p>

    <div class="actions">
      <input type="text" id="newName" placeholder="New diagram name" autocomplete="off">
      <button class="primary" id="createBtn">New diagram</button>
      <button id="importBtn">Import .bpmn files…</button>
      <input type="file" id="importFile" accept=".bpmn,.xml" multiple hidden>
    </div>

    <div class="filters" id="filters">
      <button type="button" data-filter="all" class="active">All</button>
      <button type="button" data-filter="mine">My projects</button>
      <button type="button" data-filter="shared">Shared with me</button>
    </div>
    <div id="list"></div>

    <p class="footer"><a href="/licenses" target="_blank" rel="noopener">Third-party licenses</a></p>
  </div>
  <div class="toast" id="toast"></div>

  <script type="module" src="/src/index.mjs"></script>
</body>
</html>
