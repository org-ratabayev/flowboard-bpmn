<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BPMN Editor</title>
</head>
<body class="editor">
  <div class="topbar">
    <a href="/" class="brand">← Projects</a>
    <input type="text" class="name-input" id="name" title="Rename project" autocomplete="off">
    <span class="role-badge" id="roleBadge" hidden></span>
    <span class="status" id="status"></span>
    <span class="spacer"></span>
    <div class="participants" id="participants" aria-label="People on this board"></div>
    <span class="me" id="me"></span>
    <button id="shareBtn" title="Who has access to this project">Share</button>
    <button id="chatBtn">Chat</button>
    <button id="historyBtn">History</button>
    <button id="propertiesBtn">Properties</button>
    <span class="menu-wrap">
      <button id="moreBtn">More ▾</button>
      <div class="menu" id="moreMenu">
        <button data-action="bpmn">Download .bpmn</button>
        <button data-action="svg">Export as SVG</button>
        <button data-action="png">Export as PNG</button>
        <hr>
        <button data-action="layout">Auto-layout diagram…</button>
        <hr>
        <a href="/licenses" target="_blank" rel="noopener">Third-party licenses</a>
      </div>
    </span>
    <button class="primary" id="save" title="Save (Ctrl/Cmd+S)">Save</button>
  </div>

  <div class="banner" id="banner">
    <span class="msg" id="bannerMsg"></span>
    <span id="bannerActions"></span>
  </div>

  <div class="workspace">
    <div id="canvas"></div>
    <aside class="side-panel properties" id="properties"></aside>
    <aside class="side-panel chat" id="chat">
      <div class="chat-head">
        <select id="chatConversation" title="Your conversations about this diagram"></select>
        <button type="button" id="chatNew" title="Start a new conversation">New</button>
        <button type="button" id="chatRename" title="Rename this conversation">Rename</button>
        <button type="button" id="chatDelete" title="Delete this conversation">Delete</button>
        <button type="button" id="closeChat">Close</button>
      </div>
      <ul class="chat-log" id="chatLog"></ul>
      <p class="chat-notice" id="chatNotice" hidden></p>
      <form class="chat-form" id="chatForm">
        <div class="chat-files" id="chatFiles"></div>
        <textarea id="chatInput" rows="3" placeholder="Ask or describe a change… (Enter to send, Shift+Enter for a new line)"></textarea>
        <div class="chat-actions">
          <button type="button" id="chatAttach" title="Text, CSV, Markdown or .bpmn files: up to 3, 2 MB each">Attach…</button>
          <input type="file" id="chatFileInput" multiple hidden accept=".txt,.csv,.md,.markdown,.bpmn">
          <select id="chatModel" title="AI model"></select>
          <span class="spacer"></span>
          <button type="button" id="chatCancel" hidden>Stop</button>
          <button type="submit" class="primary" id="chatSend">Send</button>
        </div>
        <input type="text" id="chatModelText" placeholder="Model name, e.g. gpt-4.1" autocomplete="off" hidden>
      </form>
    </aside>
    <aside class="side-panel history" id="history">
      <h2>History <button id="closeHistory">Close</button></h2>
      <ul id="historyList"></ul>
    </aside>
  </div>
  <div class="toast" id="toast"></div>

  <dialog class="save-dialog" id="saveDialog">
    <form method="dialog" id="saveForm">
      <h2>Save version</h2>
      <label for="saveNote">Version note (shown in History)</label>
      <textarea id="saveNote" rows="6" maxlength="2000"></textarea>
      <div class="actions">
        <span class="spacer"></span>
        <button type="button" id="saveCancel">Cancel</button>
        <button type="submit" class="primary" id="saveConfirm">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/src/editor.mjs"></script>
</body>
</html>
